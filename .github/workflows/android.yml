name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --debug --dart-define=KICK_OAUTH_PROXY_URL="$KICK_OAUTH_PROXY_URL"
        env:
          KICK_OAUTH_PROXY_URL: ${{ vars.KICK_OAUTH_PROXY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: kicksen-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
