name: kick_chat
description: >-
  Kick.com chat toolkit — reads live chat over the public Pusher WebSocket
  (no auth), plus OAuth 2.1 (PKCE) login and sending via the official Kick API.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
