name: kick_chat
description: >-
  Real-time Kick.com chat transport — reads live chat over the public Pusher
  WebSocket (no auth). Sending/moderation via the official Kick API (roadmap).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  lints: ^4.0.0
